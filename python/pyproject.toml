[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flawd"
version = "0.1.0"
description = "Independent tools and data pipeline for the FLAWD language model"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["flawd*"]
