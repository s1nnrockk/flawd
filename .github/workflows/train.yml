name: FLAWD seed training

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/seed/**"
      - "engine/**"
      - "python/flawd/dataset.py"
      - "python/flawd/dataset_cli.py"
      - "python/flawd/tokenizer.py"
      - "python/flawd/tokenizer_cli.py"
      - "python/flawd/corpus.py"
      - "python/flawd/corpus_cli.py"
      - ".github/workflows/train.yml"

concurrency:
  group: flawd-seed-training-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  train:
    name: Train compact CPU baseline
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build native trainer
        shell: pwsh
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --target flawd_train

      - name: Prepare deterministic train and validation splits
        working-directory: python
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path training-run | Out-Null
          python -m flawd.dataset_cli ../data/seed/flawd-instructions-v2.jsonl training-run/train.jsonl --validation-output training-run/validation.jsonl --validation-ratio 0.10 --seed 2026
          python -m flawd.tokenizer_cli training-run/train.jsonl training-run/tokenizer.bpe --vocab-size 512 --max-training-bytes 250000
          python -m flawd.corpus_cli training-run/train.jsonl training-run/train.tokens --tokenizer training-run/tokenizer.bpe --source-description "Original FLAWD bilingual instruction seed corpus v2; training split" --license MIT --language "ru,en"
          python -m flawd.corpus_cli training-run/validation.jsonl training-run/validation.tokens --tokenizer training-run/tokenizer.bpe --source-description "Held-out conversation-level validation split from FLAWD seed corpus v2" --license MIT --language "ru,en"

      - name: Train model and preserve validation-best checkpoint
        working-directory: python
        shell: pwsh
        run: |
          ..\build\Release\flawd_train.exe training-run\train.tokens training-run\model.flawd 2 training-run\validation.tokens - 128 32 64 2 4 2>&1 | Tee-Object -FilePath training-run\training.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write run metadata
        working-directory: python
        shell: pwsh
        run: |
          @"
          FLAWD seed training run
          Dataset: data/seed/flawd-instructions-v2.jsonl
          Dataset revision: ${{ github.sha }}
          Split: deterministic, 90% train / 10% validation, seed 2026
          Tokenizer: byte-level BPE, target vocabulary 512, fitted on training split only
          Model: context 128, embedding 32, feed-forward 64, 2 layers, 4 attention heads
          Training: 2 epochs maximum, Adam, assistant-only loss mask, validation checkpoint selection
          Hardware: GitHub-hosted Windows runner (CPU)
          "@ | Set-Content -Encoding utf8 training-run\RUN.txt

      - name: Upload model and training report
        uses: actions/upload-artifact@v4
        with:
          name: flawd-seed-model-${{ github.run_number }}
          path: |
            python/training-run/model.flawd
            python/training-run/tokenizer.bpe
            python/training-run/training.log
            python/training-run/RUN.txt
            python/training-run/train.tokens.json
            python/training-run/validation.tokens.json
          if-no-files-found: error
          retention-days: 30
